<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema PROTEJA | Gestão de Casos</title>

  <!-- Google Fonts (Inter - Fonte padrão de sistemas SaaS modernos) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Notificações -->
<div id="notification-container" class="position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

<!-- ===================== TELA DE AUTENTICAÇÃO ===================== -->
<div id="auth-wrapper" class="auth-wrapper">
  <div class="auth-box animate__animated animate__zoomIn">
    <div class="auth-brand">
      <i class="bi bi-shield-lock-fill"></i>
      <h2>PROTEJA</h2>
      <p>Gestão Inteligente de Casos</p>
    </div>

    <!-- Login -->
    <section id="login-section">
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label">Usuário (E-mail):</label>
          <input type="text" id="username" class="form-control" required placeholder="admin@proteja.com" />
        </div>
        <div class="mb-3">
          <label class="form-label">Senha:</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••" />
        </div>
        <div class="mb-3 form-check">
          <input class="form-check-input" type="checkbox" id="show-password" />
          <label class="form-check-label text-muted" style="font-size: 0.9rem;" for="show-password">Mostrar Senha</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Acessar Sistema</button>
      </form>
      <p class="mt-3 text-center text-muted" style="font-size: 0.9rem;">
        Não tem conta? <a href="#" id="link-register">Criar agora</a>
      </p>
    </section>

    <!-- Registro -->
    <section id="register-section" style="display: none;">
      <form id="register-form">
        <div class="mb-3">
          <label class="form-label">E-mail de Cadastro:</label>
          <input type="email" id="email-numero" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Crie uma Senha:</label>
          <input type="password" id="senha" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Confirme a Senha:</label>
          <input type="password" id="confirmar-senha" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-success w-100">Finalizar Cadastro</button>
      </form>
      <p class="mt-3 text-center text-muted" style="font-size: 0.9rem;">
        Já tem acesso? <a href="#" id="link-login">Fazer Login</a>
      </p>
    </section>
  </div>
</div>

<!-- ===================== SISTEMA PRINCIPAL (Pós-Login) ===================== -->
<div id="app-wrapper" class="app-layout" style="display: none;">
  
  <!-- BARRA LATERAL (SIDEBAR) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="bi bi-shield-check"></i>
      <span>PROTEJA</span>
    </div>
    
    <ul class="sidebar-menu">
      <li class="menu-title">Gestão Operacional</li>
      <li>
        <a href="#" id="nav-list" class="active">
          <i class="bi bi-table"></i> Controle de Casos
        </a>
      </li>
      <li>
        <a href="#" id="nav-new">
          <i class="bi bi-file-earmark-plus"></i> Registrar Novo Caso
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <button id="btnLogout" class="btn btn-logout w-100">
        <i class="bi bi-box-arrow-left"></i> Sair do Sistema
      </button>
    </div>
  </aside>

  <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
  <main class="main-content">
    
    <!-- HEADER DO CONTEÚDO -->
    <header class="content-header">
      <h2 id="page-title">Controle Geral de Casos</h2>
      <div class="user-profile">
        <span class="badge bg-primary">Painel Operacional</span>
      </div>
    </header>

    <div class="content-body">
      
      <!-- SEÇÃO 1: LISTAGEM E EXPORTAÇÃO -->
      <section id="list-section" class="animate__animated animate__fadeIn">
        
        <div class="action-bar card-panel">
          <div class="row align-items-center w-100">
            <div class="col-md-9 d-flex gap-3 flex-wrap">
              <div class="input-group" style="max-width: 250px;">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="filtroProntuario" class="form-control" placeholder="Buscar por Prontuário" />
              </div>
              <div class="input-group" style="max-width: 250px;">
                <span class="input-group-text"><i class="bi bi-building"></i></span>
                <input type="text" id="filtroCriad" class="form-control" placeholder="Filtrar CRIAD" />
              </div>
              <select id="filtroMes" class="form-select" style="max-width: 200px;">
                <option value="">Todos os Meses</option>
                <option value="Janeiro">Janeiro</option>
                <option value="Fevereiro">Fevereiro</option>
                <option value="Março">Março</option>
                <option value="Abril">Abril</option>
                <option value="Maio">Maio</option>
                <option value="Junho">Junho</option>
                <option value="Julho">Julho</option>
                <option value="Agosto">Agosto</option>
                <option value="Setembro">Setembro</option>
                <option value="Outubro">Outubro</option>
                <option value="Novembro">Novembro</option>
                <option value="Dezembro">Dezembro</option>
              </select>
            </div>
            
            <div class="col-md-3 text-end export-group">
              <button id="btnExportCSV" class="btn btn-outline-secondary btn-sm" title="Exportar CSV"><i class="bi bi-filetype-csv"></i></button>
              <button id="btnExportXLS" class="btn btn-outline-success btn-sm" title="Exportar Excel"><i class="bi bi-file-earmark-excel"></i></button>
              <button id="btnExportPDF" class="btn btn-outline-danger btn-sm" title="Exportar PDF"><i class="bi bi-file-earmark-pdf"></i></button>
            </div>
          </div>
        </div>

        <div class="card-panel table-responsive mt-3">
          <table id="case-table" class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Prontuário</th>
                <th>Entrada</th>
                <th>Situação</th>
                <th>CRIAD</th>
                <th>Responsável</th>
                <th>Atendimento</th>
                <th class="text-end">Ações</th>
              </tr>
            </thead>
            <tbody>
              <!-- Gerado via JS -->
            </tbody>
          </table>
          <nav id="pagination" class="mt-4"></nav>
        </div>
      </section>

      <!-- SEÇÃO 2: FORMULÁRIO (OCULTO POR PADRÃO) -->
      <section id="form-section" style="display: none;" class="animate__animated">
        <div class="card-panel form-card">
          
          <nav class="form-nav mb-4">
            <div class="nav nav-pills" id="form-tabs" role="tablist">
              <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab1" type="button">Identificação</button>
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab2" type="button">Situação</button>
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab3" type="button">Responsável</button>
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab4" type="button">Violência</button>
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab5" type="button">Encaminhamentos</button>
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab6" type="button">Retorno</button>
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab7" type="button">Estudo/Plano</button>
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab8" type="button">Atendimentos</button>
            </div>
          </nav>

          <form id="case-form">
            <div class="tab-content pt-2">
              
              <!-- Tab 1 -->
              <div class="tab-pane fade show active" id="tab1">
                <div class="form-grid">
                  <div class="field-group">
                    <label class="form-label">Número do Prontuário</label>
                    <input type="text" id="numero-prontuario" class="form-control" required />
                  </div>
                  <div class="field-group">
                    <label class="form-label">Data de Entrada</label>
                    <input type="date" id="data-entrada" class="form-control" required />
                  </div>
                  <div class="field-group">
                    <label class="form-label">Documento de Origem</label>
                    <input type="text" id="documento-origem" class="form-control" />
                  </div>
                  <div class="field-group">
                    <label class="form-label">Origem do Caso</label>
                    <select id="origem-caso" class="form-select">
                      <option value="demanda_criad">Demanda CRIAD</option>
                      <option value="demanda_responsavel">Demanda Responsável</option>
                      <option value="enc_dercca">Encaminhamento DERRCA</option>
                      <option value="enc_ct">Encaminhamento CT</option>
                      <option value="enc_mp">Encaminhamento MP</option>
                      <option value="enc_assist_social">Encaminhamento Assist. Social</option>
                      <option value="enc_educacao">Encaminhamento Educação</option>
                      <option value="enc_saude">Encaminhamento Saúde</option>
                      <option value="enc_outra_rede">Outro órgão</option>
                    </select>
                  </div>
                  <div class="field-group">
                    <label class="form-label">COR (Etnia/Cor)</label>
                    <select id="cor" class="form-select">
                      <option value="pardo">Pardo(a)</option>
                      <option value="branco">Branco(a)</option>
                      <option value="preto">Preto(a)</option>
                      <option value="indigena">Indígena</option>
                      <option value="amarelo">Amarelo(a)</option>
                      <option value="nao_informado">Não Informado</option>
                    </select>
                  </div>
                  <div class="field-group full-width">
                    <label class="form-label">Detalhamento da Origem</label>
                    <textarea id="detalhe-origem" class="form-control" rows="2"></textarea>
                  </div>
                </div>
              </div>

              <!-- Tab 2 -->
              <div class="tab-pane fade" id="tab2">
                <div class="form-grid">
                  <div class="field-group">
                    <label class="form-label">Situação Atual</label>
                    <select id="situacao-atual" class="form-select">
                      <option value="ativo">Ativo</option>
                      <option value="suspenso">Suspenso</option>
                      <option value="encerrado_com_protecao">Encerrado com proteção</option>
                      <option value="encerrado_sem_protecao">Encerrado sem proteção</option>
                      <option value="nao_competencia">Não é competência</option>
                    </select>
                  </div>
                  <div class="field-group full-width">
                    <label class="form-label">Detalhamento da Situação</label>
                    <textarea id="detalhe-situacao" class="form-control" rows="3"></textarea>
                  </div>
                </div>
              </div>

              <!-- Tab 3 -->
              <div class="tab-pane fade" id="tab3">
                <div class="form-grid">
                  <div class="field-group">
                    <label class="form-label">Nome da CRIAD</label>
                    <input type="text" id="nome-criad" class="form-control" />
                  </div>
                  <div class="field-group">
                    <label class="form-label">Nome do Responsável</label>
                    <input type="text" id="responsavel-nome" class="form-control" />
                  </div>
                  <div class="field-group">
                    <label class="form-label">CPF do Responsável</label>
                    <input type="text" id="responsavel-cpf" class="form-control" />
                  </div>
                </div>
              </div>

              <!-- Tab 4 -->
              <div class="tab-pane fade" id="tab4">
                 <div class="form-grid">
                  <div class="field-group">
                    <label class="form-label">Comunicação da Violência</label>
                    <select id="comunicacao-violencia" class="form-select">
                      <option value="comunicacao_ct">Comunicação ao CT</option>
                      <option value="comunicacao_policia">Comunicação à Polícia</option>
                      <option value="comunicacao_mp">Comunicação ao MP</option>
                      <option value="nao">Não houve comunicação</option>
                    </select>
                  </div>
                  <div class="field-group">
                    <label class="form-label">Ofício de Comunicação</label>
                    <input type="text" id="oficio-violencia" class="form-control" placeholder="Ex: 10/01/2024 - Ofício nº 123" />
                  </div>
                 </div>
              </div>

              <!-- Tab 5 -->
              <div class="tab-pane fade" id="tab5">
                 <div class="form-grid">
                  <div class="field-group">
                    <label class="form-label">Tipo de Encaminhamento</label>
                    <select id="encaminhamentos-solicitados" class="form-select">
                      <option value="">-- Selecione --</option>
                      <option value="apoio_ct">Apoio ao CT</option>
                      <option value="educacao">Educação</option>
                      <option value="assist_social">Assist. Social</option>
                      <option value="saude">Saúde</option>
                      <option value="servico_especializado">Serviço Especializado</option>
                      <option value="outros">Outros</option>
                    </select>
                  </div>
                  <div class="field-group">
                    <label class="form-label">Ofício (Data e Nº)</label>
                    <input type="text" id="data-oficio-enc" class="form-control" placeholder="Ex: 15/01/2024 - Ofício nº 456" />
                  </div>
                  <div class="field-group full-width">
                    <label class="form-label">Detalhamento</label>
                    <textarea id="detalhe-encaminhamento" class="form-control" rows="2"></textarea>
                  </div>
                 </div>
              </div>

              <!-- Tab 6 -->
              <div class="tab-pane fade" id="tab6">
                 <div class="form-grid">
                  <div class="field-group">
                    <label class="form-label">Retorno Solicitado?</label>
                    <select id="retorno-solicitado" class="form-select">
                      <option value="sim">Sim</option>
                      <option value="nao">Não</option>
                    </select>
                  </div>
                  <div class="field-group full-width">
                    <label class="form-label">Informações sobre o retorno</label>
                    <textarea id="info-retorno" class="form-control" rows="2"></textarea>
                  </div>
                 </div>
              </div>

              <!-- Tab 7 -->
              <div class="tab-pane fade" id="tab7">
                 <div class="form-grid">
                  <div class="field-group">
                    <label class="form-label">Estudo de Caso Elaborado?</label>
                    <select id="estudo-caso" class="form-select">
                      <option value="sim">Sim</option>
                      <option value="nao">Não</option>
                    </select>
                  </div>
                  <div class="field-group">
                    <label class="form-label">Plano Individual Elaborado?</label>
                    <select id="pia-elaborado" class="form-select">
                      <option value="sim">Sim</option>
                      <option value="nao">Não</option>
                    </select>
                  </div>
                 </div>
              </div>

              <!-- Tab 8 -->
              <div class="tab-pane fade" id="tab8">
                 <div class="form-grid">
                  <div class="field-group">
                    <label class="form-label">Técnicos de Referência</label>
                    <input type="text" id="tecnicos-referencia" class="form-control" />
                  </div>
                  <div class="field-group">
                    <label class="form-label">Datas de Atendimentos</label>
                    <textarea id="datas-atendimento" class="form-control" placeholder="Ex: 12/01, 15/03" rows="1"></textarea>
                  </div>
                  <div class="field-group full-width">
                    <label class="form-label">Outras Pendências</label>
                    <textarea id="outras-pendencias" class="form-control" rows="2"></textarea>
                  </div>
                 </div>
              </div>

            </div> <!-- /tab-content -->
            
            <div class="form-footer mt-4 pt-3 border-top text-end">
              <button type="button" class="btn btn-outline-secondary me-2" id="btnCancelarForm">Cancelar</button>
              <button type="button" id="btnSalvarCaso" class="btn btn-primary"><i class="bi bi-save"></i> Salvar Registro</button>
            </div>
          </form>
        </div>
      </section>

    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
